name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-${{ github.ref }}
  cancel-in-progress: true
jobs:
  light:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/verify.mjs
      - name: Smoke the clean CLI and portable recovery
        run: |
          node src/main.mjs init --state .state-ci
          node src/main.mjs demo --state .state-ci
          node src/main.mjs doctor --state .state-ci
          node src/main.mjs snapshot --state .state-ci --out snapshot-ci.json
          node src/main.mjs restore --snapshot snapshot-ci.json --state .state-restored-ci
          node src/main.mjs doctor --state .state-restored-ci
      - name: Clean-room operator reproduction
        env:
          LAUNCHWRIGHT_CLEANROOM_REPORT: evidence/clean-room/report-${{ runner.os }}.json
        run: node scripts/clean-room.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-clean-room-${{ runner.os }}-${{ github.sha }}
          path: evidence/clean-room/
          if-no-files-found: error
          retention-days: 14
