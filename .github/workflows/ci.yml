name: Application checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: light-${{ github.ref }}
  cancel-in-progress: true
jobs:
  light:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/verify.mjs
      - name: Smoke the clean CLI and portable recovery
        run: |
          node src/main.mjs init --state .state-ci
          node src/main.mjs demo --state .state-ci
          node src/main.mjs doctor --state .state-ci
          node src/main.mjs snapshot --state .state-ci --out snapshot-ci.json
          node src/main.mjs restore --snapshot snapshot-ci.json --state .state-restored-ci
          node src/main.mjs doctor --state .state-restored-ci
