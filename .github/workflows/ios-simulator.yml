name: Owned iPhone CoreSimulator capture acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/ios-simulator.yml'
      - 'src/ios-simulator-capture.mjs'
      - 'scripts/ios-simulator-capture.mjs'
      - 'scripts/ios-owned-smoke.mjs'
      - 'scripts/ios-owned-ci.sh'
      - 'fixtures/ios-owned/**'
      - 'tests/ios-simulator-capture.test.mjs'
permissions:
  contents: read
concurrency:
  group: owned-ios-simulator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ios-owned:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Exact Semwright Native SDK and injected simulator security corpus
        run: |
          set -euo pipefail
          node scripts/verify.mjs
          node --test --test-concurrency=1 tests/ios-simulator-capture.test.mjs
          node scripts/master-acceptance.mjs --check
      - name: Compile and visibly foreground synthetic UIKit fixture on real Apple CoreSimulator
        run: bash scripts/ios-owned-ci.sh
      - name: Retain real simulator PNG, Native imported UNKNOWN receipt and explicit scope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-ios-owned-${{ github.sha }}
          path: evidence/ios-owned/
          if-no-files-found: warn
          retention-days: 14
