name: R71 owned multi-document carry-forward acceptance
on:
  pull_request:
    paths:
      - 'src/release-carry-forward*.mjs'
      - 'src/server.mjs'
      - 'client/index.mjs'
      - 'web/**'
      - 'tests/*carry-forward*.mjs'
      - '.github/workflows/carry-forward-batch.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r71-carry-forward-batch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/verify.mjs
      - run: node scripts/master-acceptance.mjs --check
      - name: R70 + R71 actual Native idempotency, auth and partial recovery
        run: |
          node --test --test-concurrency=1 \
            tests/release-carry-forward-batch.test.mjs \
            tests/carry-forward-batch-ui.test.mjs \
            tests/release-carry-forward.test.mjs \
            tests/release-continuity.test.mjs
      - name: Install Chromium only on CI runner
        run: |
          npm install --prefix .ci-tools --ignore-scripts --no-audit --no-fund playwright@1.58.2
          .ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Owned batch review from browser to exact Native persisted drafts
        run: node tests/carry-forward-batch-browser.mjs
      - name: Retain SHA-scoped screenshots and privacy-limited Native receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-r71-owned-carry-forward-batch-${{ github.sha }}
          path: evidence/carry-forward-batch/
          if-no-files-found: warn
          retention-days: 14
