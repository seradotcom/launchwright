name: R67 owned browser continuity acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/continuity-web.mjs'
      - 'src/server.mjs'
      - 'client/index.mjs'
      - 'web/**'
      - 'tests/continuity*.mjs'
      - '.github/workflows/continuity-browser.yml'
permissions:
  contents: read
concurrency:
  group: r67-continuity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/verify.mjs
      - run: node --test --test-concurrency=1 tests/continuity-web.test.mjs tests/continuity-ui.test.mjs
      - name: Install Chromium only on CI runner
        run: |
          npm install --prefix .ci-tools --no-audit --no-fund --ignore-scripts playwright@1.58.2
          .ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Real local owner browser UI + SHA-256 download
        run: node tests/continuity-ui-browser.mjs
      - name: Retain exact source-scoped owned Chromium evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-r67-owned-browser-${{ github.sha }}
          path: evidence/continuity-browser/
          if-no-files-found: warn
          retention-days: 14
