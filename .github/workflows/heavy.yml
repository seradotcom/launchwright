          npm run probe
          mkdir -p .semwright-tools
          cp "$(command -v node)" .semwright-tools/node
          chmod 0755 .semwright-tools/node
          mapfile -t BROWSERS < <(find node_modules/playwright-core/.local-browsers -path '*/firefox-*/firefox/firefox' -type f -perm -111 -print)
          test "${#BROWSERS[@]}" -eq 1
          BROWSER_REL=$(realpath --relative-to="$PWD" "${BROWSERS[0]}")
          python3 "$GITHUB_WORKSPACE/.ci-semwright/scripts/motion-canvas/runtime-manifest.py" --root "$PWD" --browser-rel "$BROWSER_REL"
      - name: Materialize pinned Faust library tree
        run: |
          set -euo pipefail
          export FAUST_STAGE="$RUNNER_TEMP/faust-libraries"
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          src=Path('/usr/share/faust'); dst=Path(os.environ['FAUST_STAGE'])
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir(parents=True,mode=0o700)
          pins={}
          for source in sorted(src.rglob('*.lib')):
              if not source.is_file(): continue
              relative=source.relative_to(src); target=dst/relative
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(source,target,follow_symlinks=True); target.chmod(0o400)
              pins[relative.as_posix()]=hashlib.sha256(target.read_bytes()).hexdigest()
          if 'stdfaust.lib' not in pins or len(pins)<2: raise SystemExit('Faust library inventory is incomplete')
          (dst/'semwright-runtime.json').write_text(json.dumps({'schema_version':1,'compiler_version':'2.70.3','libraries':pins},separators=(',',':'),sort_keys=True))
          (dst/'semwright-runtime.json').chmod(0o400)
          for directory in sorted((p for p in dst.rglob('*') if p.is_dir()),reverse=True): directory.chmod(0o500)
          dst.chmod(0o500)
          if any(path.is_symlink() for path in dst.rglob('*')): raise SystemExit('staged Faust tree contains symlinks')
          PY
          echo "SEMWRIGHT_TEST_FAUST_LIBRARIES=$FAUST_STAGE" >> "$GITHUB_ENV"
      - name: Build exact Semwright host helpers and drivers
        working-directory: .ci-semwright
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror integrations/audio/faust-runtime/main.cpp -lfaust -lsndfile -o "$RUNNER_TEMP/semwright-faust-interpreter"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror integrations/audio/analysis-runtime/main.cpp -lebur128 -lsndfile -o "$RUNNER_TEMP/semwright-audio-meter"
          cargo build --locked --bins \
            -p semwright-plugin-host \
            -p semwright-driver-motion-canvas \
            -p semwright-faust-audio-driver \
            -p semwright-mlt-video-driver
          strip --strip-unneeded \
            target/debug/semwright-sandbox \
            target/debug/semwright-motion-canvas-driver \
            target/debug/semwright-faust-audio-driver \
            target/debug/semwright-audio-analysis-driver \
            target/debug/semwright-mlt-video-driver \
            target/debug/semwright-mlt-runtime-runner
          chmod 0500 \
            target/debug/semwright-sandbox \
            target/debug/semwright-motion-canvas-driver \
            target/debug/semwright-faust-audio-driver \
            target/debug/semwright-audio-analysis-driver \
            target/debug/semwright-mlt-video-driver \
            target/debug/semwright-mlt-runtime-runner
          mkdir -p "$RUNNER_TEMP/composition-av-binaries"
          for name in semwright-sandbox semwright-motion-canvas-driver semwright-faust-audio-driver semwright-audio-analysis-driver semwright-mlt-video-driver semwright-mlt-runtime-runner; do
            install -m 0500 "target/debug/$name" "$RUNNER_TEMP/composition-av-binaries/$name"
