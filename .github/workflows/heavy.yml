          grep -q '^LAUNCHWRIGHT_SINGLE_RECIPE_COMPOSITION_PASS ' evidence/composition/semwright-single-recipe-av.log
          cp verification/composition-av/launchwright-deltadesk-single-recipe.json evidence/composition/
          cp verification/composition-av/launchwright-deltadesk-single-recipe.mp4 evidence/composition/
          cp verification/composition-av/combined-native.json evidence/composition/semwright-combined-native.json
          cp verification/composition-av/c14-project-graph.json evidence/composition/semwright-combined-project-graph.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Verify exact Broker-to-single-recipe lineage and bounded authority
        env:
          LAUNCHWRIGHT_SOURCE_SHA: ${{ github.sha }}
          DELTADESK_BROKER_RECEIPT: ${{ github.workspace }}/evidence/composition/semwright-deltadesk-broker.json
          LAUNCHWRIGHT_SINGLE_RECIPE_RECEIPT: ${{ github.workspace }}/evidence/composition/launchwright-deltadesk-single-recipe.json
          LAUNCHWRIGHT_SINGLE_RECIPE_MASTER: ${{ github.workspace }}/evidence/composition/launchwright-deltadesk-single-recipe.mp4
        run: |
          set -euo pipefail
          node scripts/verify-composition-single-recipe.mjs | tee evidence/composition/launchwright-composition-single-recipe-verifier.log
          node - <<'NODE'
          const r=require('./evidence/composition/launchwright-composition-single-recipe-chain.json');
          if(
            r.technical_state!=='PASS' ||
            r.media_requirement_state!=='PASS' ||
            r.single_recipe_real_capture_composition!=='PASS' ||
            r.capture_authority!=='IMPORTED_UNVERIFIED' ||
            r.platform_execution_authority!==false ||
            r.external_customer_acceptance!==false
