name: Native and browser acceptance
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Select only the lane affected by the change
        type: choice
        options: [all, native, host, verifier, browser, deltadesk, composition, effects, godot, stress]
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: heavy-${{ inputs.lane }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    if: inputs.lane == 'all' || inputs.lane == 'browser'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix .ci-tools --no-audit --no-fund --ignore-scripts playwright@1.58.2
      - run: .ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-browser-${{ github.sha }}
          path: evidence/browser/
          if-no-files-found: error
          retention-days: 14
  native:
    if: inputs.lane == 'all' || inputs.lane == 'native'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical TypeScript SDK with its declared compiler
        run: |
          cd vendor/semwright-native-sdk
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - run: node scripts/build-native-bundle.mjs
      - name: Pin compiler and build actual Rust NativeDriver
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          export LAUNCHWRIGHT_NATIVE_CORE_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.core.sha256')"
          export LAUNCHWRIGHT_NATIVE_PRODUCTION_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.production.sha256')"
          export LAUNCHWRIGHT_NATIVE_REVIEW_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.review.sha256')"
          export LAUNCHWRIGHT_NATIVE_VERIFIER_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.verifier.sha256')"
          export LAUNCHWRIGHT_NATIVE_INTEGRATIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.integrations.sha256')"
          export LAUNCHWRIGHT_NATIVE_EXTENSIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.extensions.sha256')"
          export LAUNCHWRIGHT_NATIVE_WORK_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.work.sha256')"
          export LAUNCHWRIGHT_NATIVE_MEDIA_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.media.sha256')"
          export LAUNCHWRIGHT_NATIVE_PUBLISH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.publish.sha256')"
          export LAUNCHWRIGHT_NATIVE_GRAPH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.graph.sha256')"
          export LAUNCHWRIGHT_NATIVE_EFFECTS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.effects.sha256')"
          mkdir -p evidence/native
          rustc -Vv | tee evidence/native/compiler.txt
          cargo test -p launchwright-native 2>&1 | tee evidence/native/cargo-test.log
          cargo build -p launchwright-native --release 2>&1 | tee evidence/native/cargo-build.log
          node tests/bundle-smoke.mjs
      - name: Retain exact bytes and lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-native-${{ github.sha }}
          path: |
            evidence/native/
            dist/native-bundle.json
            dist/launchwright-*.cjs
            target/release/launchwright-native
            Cargo.lock
          if-no-files-found: error
          retention-days: 14

  host:
    if: inputs.lane == 'all' || inputs.lane == 'host'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SEMWRIGHT_SHA: 8fa191250ae68274182570c65f067f7a60f85625
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical TypeScript SDK and bounded Launchwright bundles
        run: |
          set -euo pipefail
          (cd vendor/semwright-native-sdk && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          node scripts/build-native-bundle.mjs
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Pin Rust and prepare canonical disposable-runner sandbox
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          (cd .ci-semwright && rustup override set 1.98.1)
          mkdir -p evidence/native-host
          test "$(git -C .ci-semwright rev-parse HEAD)" = "$SEMWRIGHT_SHA"
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          bash .ci-semwright/scripts/dev/ci-driver-bwrap-profile.sh evidence/native-host/host-sandbox-profile.txt
      - name: Install canonical daemon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang
      - name: Build exact Launchwright NativeDriver with reviewed bundle pins
        run: |
          set -euo pipefail
          export LAUNCHWRIGHT_NATIVE_CORE_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.core.sha256')"
          export LAUNCHWRIGHT_NATIVE_PRODUCTION_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.production.sha256')"
          export LAUNCHWRIGHT_NATIVE_REVIEW_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.review.sha256')"
          export LAUNCHWRIGHT_NATIVE_VERIFIER_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.verifier.sha256')"
          export LAUNCHWRIGHT_NATIVE_INTEGRATIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.integrations.sha256')"
          export LAUNCHWRIGHT_NATIVE_EXTENSIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.extensions.sha256')"
          export LAUNCHWRIGHT_NATIVE_WORK_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.work.sha256')"
          export LAUNCHWRIGHT_NATIVE_MEDIA_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.media.sha256')"
          export LAUNCHWRIGHT_NATIVE_PUBLISH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.publish.sha256')"
          export LAUNCHWRIGHT_NATIVE_GRAPH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.graph.sha256')"
          export LAUNCHWRIGHT_NATIVE_EFFECTS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.effects.sha256')"
          # Launchwright intentionally follows the existing Native lane policy: its binary
          # lockfile is generated on the disposable runner. Semwright itself remains --locked.
          cargo build -p launchwright-native
          sha256sum target/debug/launchwright-native > evidence/native-host/launchwright-native.sha256
      - name: Build exact Semwright daemon, CLI, sandbox Host and Effects reader
        working-directory: .ci-semwright
        run: |
          set -euo pipefail
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
          cargo build --locked -p semwright-native-sdk --features effects --bin semwright-native-effects
          sha256sum target/debug/semwright target/debug/semwrightd target/debug/semwright-sandbox target/debug/semwright-native-effects > "$GITHUB_WORKSPACE/evidence/native-host/semwright-binaries.sha256"
      - name: Real Broker Policy Driver Host NodeBridge acceptance
        env:
          SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/.ci-semwright
          LAUNCHWRIGHT_NATIVE_BINARY: ${{ github.workspace }}/target/debug/launchwright-native
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/.ci-semwright/target/debug/semwright-sandbox
        run: |
          set -euo pipefail
          python3 scripts/verify-native-host.py | tee evidence/native-host/acceptance.log
          grep -q '^LAUNCHWRIGHT_NATIVE_HOST_ACCEPTANCE_PASS ' evidence/native-host/acceptance.log
          jq -e '.passed == true and .authority.driver_host_isolation_accepted == true and .authority.broker_policy_path_observed == true and .authority.host_mediated_node_runtime == true and .authority.extension_control_plane_driver_host_accepted == true and .authority.extension_fixture_execution_host_isolation_accepted == false and .authority.project_graph_live_broker_admitted == true and .authority.project_graph_native_projection_recorded == true and .authority.project_graph_platform_job_authority == false and .authority.effects_canonical_readback_host_custody_accepted == true and .authority.effects_owner_admission_accepted == false and .authority.effects_evaluation_driver_host_isolation_accepted == false and .authority.effects_execution_authority == false and .authority.platform_external_acceptance == false' evidence/native-host/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-native-host-${{ github.sha }}
          path: |
            evidence/native-host/
            dist/native-bundle.json
          if-no-files-found: error
          retention-days: 14


  verifier:
    if: inputs.lane == 'all' || inputs.lane == 'verifier'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      SEMWRIGHT_SHA: 8fa191250ae68274182570c65f067f7a60f85625
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical TypeScript SDK and bounded Launchwright bundles
        run: |
          set -euo pipefail
          (cd vendor/semwright-native-sdk && npm ci --ignore-scripts --no-audit --no-fund && npm run build)
          node scripts/build-native-bundle.mjs
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Pin Rust and prepare canonical disposable-runner sandbox
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal
          rustup override set 1.98.1
          (cd .ci-semwright && rustup override set 1.98.1)
          mkdir -p evidence/verifier-runtime
          test "$(git -C .ci-semwright rev-parse HEAD)" = "$SEMWRIGHT_SHA"
          test "$(sysctl -n kernel.unprivileged_userns_clone)" = 1
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          bash .ci-semwright/scripts/dev/ci-driver-bwrap-profile.sh evidence/verifier-runtime/host-sandbox-profile.txt
      - name: Install canonical daemon build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpipewire-0.3-dev pkg-config clang
      - name: Build exact NativeDriver and bounded verifier provider
        run: |
          set -euo pipefail
          export LAUNCHWRIGHT_NATIVE_CORE_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.core.sha256')"
          export LAUNCHWRIGHT_NATIVE_PRODUCTION_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.production.sha256')"
          export LAUNCHWRIGHT_NATIVE_REVIEW_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.review.sha256')"
          export LAUNCHWRIGHT_NATIVE_VERIFIER_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.verifier.sha256')"
          export LAUNCHWRIGHT_NATIVE_INTEGRATIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.integrations.sha256')"
          export LAUNCHWRIGHT_NATIVE_EXTENSIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.extensions.sha256')"
          export LAUNCHWRIGHT_NATIVE_WORK_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.work.sha256')"
          export LAUNCHWRIGHT_NATIVE_MEDIA_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.media.sha256')"
          export LAUNCHWRIGHT_NATIVE_PUBLISH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.publish.sha256')"
          export LAUNCHWRIGHT_NATIVE_GRAPH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.graph.sha256')"
          export LAUNCHWRIGHT_NATIVE_EFFECTS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.effects.sha256')"
          cargo test -p launchwright-verifier-driver
          cargo build -p launchwright-native -p launchwright-verifier-driver
          sha256sum target/debug/launchwright-native target/debug/launchwright-verifier-driver > evidence/verifier-runtime/launchwright-binaries.sha256
      - name: Build exact Semwright daemon CLI and sandbox Host
        working-directory: .ci-semwright
        run: |
          set -euo pipefail
          cargo build --locked -p semwright-daemon -p semwright-cli --bins
          cargo build --locked -p semwright-plugin-host --bin semwright-sandbox
          sha256sum target/debug/semwright target/debug/semwrightd target/debug/semwright-sandbox > "$GITHUB_WORKSPACE/evidence/verifier-runtime/semwright-binaries.sha256"
      - name: Real verifier Broker Policy Driver Host Native SDK admission
        env:
          SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/.ci-semwright
          LAUNCHWRIGHT_NATIVE_BINARY: ${{ github.workspace }}/target/debug/launchwright-native
          LAUNCHWRIGHT_VERIFIER_BINARY: ${{ github.workspace }}/target/debug/launchwright-verifier-driver
          SEMWRIGHT_TEST_DRIVER_SANDBOX: '1'
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ github.workspace }}/.ci-semwright/target/debug/semwright-sandbox
        run: |
          set -euo pipefail
          python3 scripts/verify-verifier-runtime.py | tee evidence/verifier-runtime/acceptance.log
          grep -q '^LAUNCHWRIGHT_VERIFIER_RUNTIME_ACCEPTANCE_PASS ' evidence/verifier-runtime/acceptance.log
          jq -e '.passed == true and .authority.canonical_verifier_runtime_admitted == true and .authority.broker_policy_path_observed == true and .authority.driver_host_isolation_accepted == true and .authority.native_sdk_review_recorded == true and .authority.artifact_substitution_rejected == true and .authority.receipt_candidate_substitution_rejected == true and .authority.platform_execution_authority == false and .authority.external_customer_acceptance == false and .authority.semantic_authority == false and .authority.editorial_authority == false and .authority.publication_authority == false' evidence/verifier-runtime/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-verifier-runtime-${{ github.sha }}
          path: |
            evidence/verifier-runtime/
            dist/native-bundle.json
            Cargo.lock
          if-no-files-found: error
          retention-days: 14

  effects:
    if: inputs.lane == 'all' || inputs.lane == 'effects'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEMWRIGHT_SHA: 8fa191250ae68274182570c65f067f7a60f85625
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Build canonical Native SDK Effects reader
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          (cd .ci-semwright && rustup override set 1.98.1)
          (cd .ci-semwright && cargo build --locked -p semwright-native-sdk --features effects --bin semwright-native-effects)
      - name: Prepare exact Launchwright-owned artifact fixture
        run: |
          mkdir -p evidence/effects/protected
          node scripts/prepare-effects-acceptance.mjs | tee evidence/effects/prepare.log
      - name: Evaluate with the real canonical Effects CLI
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/.ci-semwright/target/debug/semwright-native-effects"
          "$BIN" --prepare < evidence/effects/definition.json > evidence/effects/protected/spec.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('evidence/effects/protected/spec.json')
          p.write_bytes(p.read_bytes().rstrip(b'\n'))
          p.chmod(0o600)
          PY
          SPEC_SHA="$(sha256sum evidence/effects/protected/spec.json | cut -d' ' -f1)"
          printf '%s\n' "$SPEC_SHA" > evidence/effects/protected/spec.sha256
          "$BIN" --spec "$GITHUB_WORKSPACE/evidence/effects/protected/spec.json" --spec-sha256 "$SPEC_SHA" --artifact-root "$GITHUB_WORKSPACE/evidence/effects/artifacts" </dev/null > evidence/effects/result.json
          jq -e '.schema_version == "semwright-native-effects-result/1" and .verdict == "PASS" and .execution_authority == false and .scope == "immutable_native_sdk_artifact_properties_only"' evidence/effects/result.json
          node scripts/verify-effects-acceptance.mjs | tee evidence/effects/launchwright-verifier.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-effects-${{ github.sha }}
          path: evidence/effects/
          if-no-files-found: error
          retention-days: 14

  godot:
    if: inputs.lane == 'all' || inputs.lane == 'godot'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SEMWRIGHT_SHA: 8fa191250ae68274182570c65f067f7a60f85625
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Pin source, compiler and Driver Host sandbox
        run: |
          set -euo pipefail
          mkdir -p evidence/godot
          test "$(git -C .ci-semwright rev-parse HEAD)" = "$SEMWRIGHT_SHA"
          rustup toolchain install 1.98.1 --profile minimal
          (cd .ci-semwright && rustup override set 1.98.1)
          bash .ci-semwright/scripts/dev/ci-driver-bwrap-profile.sh evidence/godot/host-sandbox-profile.txt
          bwrap --version | tee evidence/godot/bwrap-version.log
      - name: Install exact Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot"
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e  $GODOT" | sha256sum -c -
          "$GODOT" --version | tee evidence/godot/godot-version.log
          sha256sum "$GODOT" | tee evidence/godot/godot.sha256
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
      - name: Exact native readback and scene-save contracts
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/godot-native-contracts"
          mkdir -p "$fixture/addons" "$fixture/tests"
          cp -R .ci-semwright/integrations/godot/addons/semwright "$fixture/addons/"
          cp .ci-semwright/integrations/godot/tests/*_contract.gd "$fixture/tests/"
          printf '%s\n' 'config_version=5' '[application]' 'config/name="Launchwright Godot Native Contracts"' > "$fixture/project.godot"
          for contract in readback scene_save; do
            log="evidence/godot/${contract}-contract.log"
            timeout 90 "$GODOT_BIN" --headless --path "$fixture" --script "res://tests/${contract}_contract.gd" 2>&1 | tee "$log"
            grep -q "^${contract^^}_FIXTURE_TESTS PASS:" "$log"
            if grep -E "ERROR:|SCRIPT ERROR:|Parse Error:" "$log"; then
              exit 1
            fi
          done
      - name: Build exact Godot driver and Driver Host sandbox helper
        run: |
          set -euo pipefail
          (
            cd .ci-semwright
            cargo build --locked \
              -p semwright-driver-godot --bin semwright-godot-driver \
              -p semwright-plugin-host --bin semwright-sandbox
          ) 2>&1 | tee evidence/godot/semwright-build.log
          sha256sum \
            .ci-semwright/target/debug/semwright-godot-driver \
            .ci-semwright/target/debug/semwright-sandbox \
            | tee evidence/godot/semwright-binaries.sha256
      - name: Exact Driver Host conformance for Godot provider
        run: |
          set -euo pipefail
          (
            cd .ci-semwright
            SEMWRIGHT_TEST_GODOT=1 \
            SEMWRIGHT_TEST_SANDBOX_HELPER="$GITHUB_WORKSPACE/.ci-semwright/target/debug/semwright-sandbox" \
              cargo test --locked -p semwright-driver-godot --test host_conformance -- --ignored --nocapture
          ) 2>&1 | tee evidence/godot/host-conformance.log
          grep -q 'test result: ok' evidence/godot/host-conformance.log
          echo "GODOT_HOST_CONFORMANCE=PASS" >> "$GITHUB_ENV"
      - name: Real Godot semantic execution
        run: |
          set -euo pipefail
          echo "GODOT_PROFILE_STARTED_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          (
            cd .ci-semwright
            SEMWRIGHT_TEST_GODOT_BIN="$GODOT_BIN" \
            SEMWRIGHT_GODOT_TRACE="$GITHUB_WORKSPACE/evidence/godot/godot-real-trace.json" \
            BIN_DIR="$GITHUB_WORKSPACE/.ci-semwright/target/debug" \
              python3 -u crates/driver-godot/tools/e2e_real.py
          ) 2>&1 | tee evidence/godot/godot-real-e2e.log
          grep -q '^REAL_GODOT_ACCEPTANCE_PASS ' evidence/godot/godot-real-e2e.log
          grep -q '^runtime_marker=SEMWRIGHT_LAB_READY' evidence/godot/godot-real-e2e.log
          ! grep -E "ERROR:|SCRIPT ERROR:|Parse Error:" evidence/godot/godot-real-trace.json
      - name: Verify RS-PRO-02 through Launchwright Native SDK profile
        env:
          SEMWRIGHT_GODOT_TRACE: ${{ github.workspace }}/evidence/godot/godot-real-trace.json
          GODOT_DRIVER_BIN: ${{ github.workspace }}/.ci-semwright/target/debug/semwright-godot-driver
          LAUNCHWRIGHT_GODOT_REPORT: ${{ github.workspace }}/evidence/godot/launchwright-godot-profile.json
        run: |
          set -euo pipefail
          node scripts/verify-godot-profile.mjs | tee evidence/godot/launchwright-verifier.log
          grep -q '^LAUNCHWRIGHT_GODOT_PROFILE_PASS ' evidence/godot/launchwright-verifier.log
          jq -e '
            .requirement_id == "RS-PRO-02" and
            .profile == "godot" and
            .acceptance_state == "PASS" and
            .profile_contract.engine_real_observed == true and
            .profile_contract.video_import_substitute == false and
            .native_sdk.receipt_recorded == true and
            .native_sdk.durable_receipt_technical_state == "UNKNOWN" and
            .authority.driver_host_conformance_observed == true and
            .authority.same_end_to_end_host_engine_path == false and
            .authority.platform_execution_authority == false and
            .authority.external_customer_acceptance == false
          ' evidence/godot/launchwright-godot-profile.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-godot-profile-${{ github.sha }}
          path: evidence/godot/
