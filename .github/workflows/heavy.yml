name: Native and browser acceptance
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Select only the lane affected by the change
        type: choice
        options: [all, native, effects, browser, godot, deltadesk, stress]
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: heavy-${{ inputs.lane }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    if: inputs.lane == 'all' || inputs.lane == 'browser'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix .ci-tools --no-audit --no-fund --ignore-scripts playwright@1.58.2
      - run: .ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-browser-${{ github.sha }}
          path: evidence/browser/
          if-no-files-found: error
          retention-days: 14
  native:
    if: inputs.lane == 'all' || inputs.lane == 'native'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical TypeScript SDK with its declared compiler
        run: |
          cd vendor/semwright-native-sdk
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - run: node scripts/build-native-bundle.mjs
      - name: Pin compiler and build actual Rust NativeDriver
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          export LAUNCHWRIGHT_NATIVE_CORE_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.core.sha256')"
          export LAUNCHWRIGHT_NATIVE_SOURCES_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.sources.sha256')"
          export LAUNCHWRIGHT_NATIVE_GRAPH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.graph.sha256')"
          export LAUNCHWRIGHT_NATIVE_EFFECTS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.effects.sha256')"
          export LAUNCHWRIGHT_NATIVE_PRODUCTION_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.production.sha256')"
          export LAUNCHWRIGHT_NATIVE_REVIEW_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.review.sha256')"
          export LAUNCHWRIGHT_NATIVE_INTEGRATIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.integrations.sha256')"
          export LAUNCHWRIGHT_NATIVE_WORK_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.work.sha256')"
          export LAUNCHWRIGHT_NATIVE_MEDIA_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.media.sha256')"
          export LAUNCHWRIGHT_NATIVE_PUBLISH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.publish.sha256')"
          mkdir -p evidence/native
          rustc -Vv | tee evidence/native/compiler.txt
          cargo test -p launchwright-native 2>&1 | tee evidence/native/cargo-test.log
          cargo build -p launchwright-native --release 2>&1 | tee evidence/native/cargo-build.log
          node tests/bundle-smoke.mjs
      - name: Retain exact bytes and lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-native-${{ github.sha }}
          path: |
            evidence/native/
            dist/native-bundle.json
            dist/launchwright-*.cjs
            target/release/launchwright-native
            Cargo.lock
          if-no-files-found: error
          retention-days: 14

  effects:
    if: inputs.lane == 'all' || inputs.lane == 'effects'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SEMWRIGHT_SHA: 4d291de26724810017ce7b6d185326514cb79fa6
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Build canonical Native SDK Effects reader
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          (cd .ci-semwright && rustup override set 1.98.1)
          (cd .ci-semwright && cargo build --locked -p semwright-native-sdk --features effects --bin semwright-native-effects)
      - name: Prepare exact Launchwright-owned artifact fixture
        run: |
          mkdir -p evidence/effects
          node scripts/prepare-effects-acceptance.mjs | tee evidence/effects/prepare.log
      - name: Evaluate with the real canonical Effects CLI
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/.ci-semwright/target/debug/semwright-native-effects"
          "$BIN" --prepare < evidence/effects/definition.json > evidence/effects/spec.json
          python3 - <<'PY'
          from pathlib import Path
          p=Path('evidence/effects/spec.json')
          p.write_bytes(p.read_bytes().rstrip(b'\n'))
          PY
          SPEC_SHA="$(sha256sum evidence/effects/spec.json | cut -d' ' -f1)"
          printf '%s\n' "$SPEC_SHA" > evidence/effects/spec.sha256
          "$BIN" --spec "$GITHUB_WORKSPACE/evidence/effects/spec.json" --spec-sha256 "$SPEC_SHA" --artifact-root "$GITHUB_WORKSPACE/evidence/effects/artifacts" </dev/null > evidence/effects/result.json
          jq -e '.schema_version == "semwright-native-effects-result/1" and .verdict == "PASS" and .execution_authority == false and .scope == "immutable_native_sdk_artifact_properties_only"' evidence/effects/result.json
          node scripts/verify-effects-acceptance.mjs | tee evidence/effects/launchwright-verifier.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-effects-${{ github.sha }}
          path: evidence/effects/
          if-no-files-found: error
          retention-days: 14

  godot:
    if: inputs.lane == 'all' || inputs.lane == 'godot'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SEMWRIGHT_SHA: 4d291de26724810017ce7b6d185326514cb79fa6
      GODOT_SHA256: 8d106cbe6144c2dc7e881d61d2429c1a8a76e6b22ef48bd5e48dcf934953f71e
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout the exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Pin Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          (cd .ci-semwright && rustup override set 1.98.1)
      - name: Install pinned Godot 4.7.2
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godot" evidence/godot
          curl -fL --retry 4 --retry-delay 2 \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT="$RUNNER_TEMP/godot/Godot_v4.7.2-stable_linux.x86_64"
          echo "$GODOT_SHA256  $GODOT" | sha256sum -c -
          "$GODOT" --version | tee evidence/godot/godot-version.log
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
      - name: Build canonical Semwright Godot driver
        run: |
          set -o pipefail
          (cd .ci-semwright && cargo build --locked -p semwright-driver-godot --bin semwright-godot-driver) \
            2>&1 | tee evidence/godot/semwright-driver-build.log
      - name: Execute real Godot semantic acceptance
        env:
          SEMWRIGHT_TEST_GODOT_BIN: ${{ env.GODOT_BIN }}
          SEMWRIGHT_GODOT_TRACE: ${{ github.workspace }}/evidence/godot/semwright-trace.json
          BIN_DIR: ${{ github.workspace }}/.ci-semwright/target/debug
        run: |
          set -euo pipefail
          (cd .ci-semwright && python3 -u crates/driver-godot/tools/e2e_real.py) \
            2>&1 | tee evidence/godot/semwright-real-e2e.log
          grep -q '^REAL_GODOT_ACCEPTANCE_PASS ' evidence/godot/semwright-real-e2e.log
          ! grep -E 'ERROR:|SCRIPT ERROR:|Parse Error:' evidence/godot/semwright-trace.json
      - name: Bind real-engine evidence to Launchwright profile contract
        env:
          SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/.ci-semwright
          SEMWRIGHT_GODOT_TRACE: ${{ github.workspace }}/evidence/godot/semwright-trace.json
        run: node scripts/verify-godot-acceptance.mjs | tee evidence/godot/launchwright-verifier.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-godot-${{ github.sha }}
          path: evidence/godot/
          if-no-files-found: error
          retention-days: 14

  deltadesk:
    if: inputs.lane == 'all' || inputs.lane == 'deltadesk'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SEMWRIGHT_SHA: 4d291de26724810017ce7b6d185326514cb79fa6
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Pin Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          (cd .ci-semwright && rustup override set 1.98.1)
      - name: Bind runner browser exactly like Semwright Chromium CI
        run: |
          set -euo pipefail
          mkdir -p evidence/deltadesk
          command -v google-chrome
          google-chrome --version | tee evidence/deltadesk/browser-version.log
          test -x /opt/google/chrome/chrome
          sudo chmod 0755 /opt/google/chrome/chrome
          stat -c '%A %a %U:%G %n' /opt/google/chrome/chrome | tee evidence/deltadesk/browser-binary.log
          CHROMIUM=/opt/google/chrome/chrome
          echo "SEMWRIGHT_TEST_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          sha256sum "$CHROMIUM" | tee evidence/deltadesk/chromium.sha256
      - name: Start owned DeltaDesk A/B fixture
        run: |
          set -euo pipefail
          PORT=4399 node lab/deltadesk/server.mjs 4399 > evidence/deltadesk/server.log 2>&1 &
          echo "DELTADESK_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4399/health > evidence/deltadesk/health.json; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:4399/health
          curl -fsS -X POST http://127.0.0.1:4399/lab/reset > evidence/deltadesk/reset.json
      - name: Execute DeltaDesk through real Semwright Chromium adapter
        env:
          LAUNCHWRIGHT_DELTADESK_ORIGIN: http://127.0.0.1:4399
          LAUNCHWRIGHT_EVIDENCE_DIR: ${{ github.workspace }}/evidence/deltadesk
        run: |
          set -euo pipefail
          cp acceptance/chromium_deltadesk.rs .ci-semwright/crates/adapters/tests/launchwright_deltadesk.rs
          (
            cd .ci-semwright
            cargo test --locked -p semwright-adapters --test launchwright_deltadesk -- --ignored --nocapture
          ) 2>&1 | tee evidence/deltadesk/semwright-browser.log
          grep -q '^REAL_DELTADESK_BROWSER_ACCEPTANCE_PASS ' evidence/deltadesk/semwright-browser.log
      - name: Bind real browser evidence to Launchwright
        env:
          SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/.ci-semwright
          DELTADESK_DRIVER_RECEIPT: ${{ github.workspace }}/evidence/deltadesk/semwright-deltadesk-driver.json
        run: node scripts/verify-deltadesk-browser.mjs | tee evidence/deltadesk/launchwright-verifier.log
      - name: Stop owned DeltaDesk fixture
        if: always()
        run: |
          if [ -n "${DELTADESK_PID:-}" ]; then kill "$DELTADESK_PID" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-deltadesk-${{ github.sha }}
          path: evidence/deltadesk/
          if-no-files-found: error
          retention-days: 14

  stress:
    if: inputs.lane == 'all' || inputs.lane == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bounded persistence, paging and restore stress
        run: node tests/stress.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-stress-${{ github.sha }}
          path: evidence/stress/
          if-no-files-found: error
          retention-days: 14
