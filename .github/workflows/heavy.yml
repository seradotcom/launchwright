          ) 2>&1 | tee evidence/composition/semwright-browser-broker.log
          grep -q '^REAL_DELTADESK_BROKER_ACCEPTANCE_PASS ' evidence/composition/semwright-browser-broker.log
          CAPTURE_A_SHA256="$(sha256sum evidence/composition/deltadesk-a-checkout.png | awk '{print $1}')"
