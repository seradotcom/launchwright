  deltadesk:
    if: inputs.lane == 'all' || inputs.lane == 'deltadesk'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SEMWRIGHT_SHA: 8fa191250ae68274182570c65f067f7a60f85625
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Pin Semwright Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          (cd .ci-semwright && rustup override set 1.98.1)
      - name: Bind runner Chromium exactly like Semwright CI
        run: |
          set -euo pipefail
          mkdir -p evidence/deltadesk
          command -v google-chrome
          google-chrome --version | tee evidence/deltadesk/browser-version.log
          test -x /opt/google/chrome/chrome
          sudo chmod 0755 /opt/google/chrome/chrome
          stat -c '%A %a %U:%G %n' /opt/google/chrome/chrome | tee evidence/deltadesk/browser-binary.log
          CHROMIUM=/opt/google/chrome/chrome
          echo "SEMWRIGHT_TEST_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          sha256sum "$CHROMIUM" | tee evidence/deltadesk/chromium.sha256
      - name: Install pinned Semwright Linux media build prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev
      - name: Start owned DeltaDesk A/B fixture
        run: |
          set -euo pipefail
          PORT=4399 node lab/deltadesk/server.mjs 4399 > evidence/deltadesk/server.log 2>&1 &
          echo "DELTADESK_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4399/health > evidence/deltadesk/health.json; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:4399/health
          curl -fsS -X POST http://127.0.0.1:4399/lab/reset > evidence/deltadesk/reset.json
      - name: Execute DeltaDesk through real Semwright Broker, Policy and Chromium adapter
        env:
          LAUNCHWRIGHT_DELTADESK_ORIGIN: http://127.0.0.1:4399
          LAUNCHWRIGHT_EVIDENCE_DIR: ${{ github.workspace }}/evidence/deltadesk
        run: |
          set -euo pipefail
          mkdir -p .ci-semwright/crates/daemon/tests
          cp acceptance/chromium_deltadesk_broker.rs .ci-semwright/crates/daemon/tests/launchwright_deltadesk_broker.rs
          (
            cd .ci-semwright
            cargo test --locked -p semwright-daemon --test launchwright_deltadesk_broker \
              real_semwright_broker_policy_captures_deltadesk_a_and_b \
              -- --ignored --exact --nocapture
          ) 2>&1 | tee evidence/deltadesk/semwright-browser-broker.log
          grep -q '^REAL_DELTADESK_BROKER_ACCEPTANCE_PASS ' evidence/deltadesk/semwright-browser-broker.log
      - name: Ingest Broker-routed real adapter evidence without fabricating Platform authority
        env:
          SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/.ci-semwright
          DELTADESK_DRIVER_RECEIPT: ${{ github.workspace }}/evidence/deltadesk/semwright-deltadesk-broker.json
        run: node scripts/verify-deltadesk-browser.mjs | tee evidence/deltadesk/launchwright-verifier.log
      - name: Stop owned DeltaDesk fixture
        if: always()
        run: |
          if [ -n "${DELTADESK_PID:-}" ]; then kill "$DELTADESK_PID" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-deltadesk-${{ github.sha }}
          path: evidence/deltadesk/
          if-no-files-found: error
          retention-days: 14

  composition:
    if: inputs.lane == 'all' || inputs.lane == 'composition'
