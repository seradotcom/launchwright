name: Native and browser acceptance
on:
  workflow_dispatch:
    inputs:
      lane:
        description: Select only the lane affected by the change
        type: choice
        options: [all, native, browser, deltadesk, composition, stress]
        default: all
        required: true
permissions:
  contents: read
concurrency:
  group: heavy-${{ inputs.lane }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  browser:
    if: inputs.lane == 'all' || inputs.lane == 'browser'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --prefix .ci-tools --no-audit --no-fund --ignore-scripts playwright@1.58.2
      - run: .ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-browser-${{ github.sha }}
          path: evidence/browser/
          if-no-files-found: error
          retention-days: 14
  native:
    if: inputs.lane == 'all' || inputs.lane == 'native'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build canonical TypeScript SDK with its declared compiler
        run: |
          cd vendor/semwright-native-sdk
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - run: node scripts/build-native-bundle.mjs
      - name: Pin compiler and build actual Rust NativeDriver
        run: |
          rustup toolchain install stable --profile minimal
          rustup override set stable
          export LAUNCHWRIGHT_NATIVE_CORE_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.core.sha256')"
          export LAUNCHWRIGHT_NATIVE_PRODUCTION_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.production.sha256')"
          export LAUNCHWRIGHT_NATIVE_REVIEW_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.review.sha256')"
          export LAUNCHWRIGHT_NATIVE_INTEGRATIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.integrations.sha256')"
          export LAUNCHWRIGHT_NATIVE_EXTENSIONS_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.extensions.sha256')"
          export LAUNCHWRIGHT_NATIVE_WORK_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.work.sha256')"
          export LAUNCHWRIGHT_NATIVE_MEDIA_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.media.sha256')"
          export LAUNCHWRIGHT_NATIVE_PUBLISH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.publish.sha256')"
          export LAUNCHWRIGHT_NATIVE_GRAPH_BUNDLE_SHA256="$(node -p 'JSON.parse(require("fs").readFileSync("dist/native-bundle.json","utf8")).profiles.graph.sha256')"
          mkdir -p evidence/native
          rustc -Vv | tee evidence/native/compiler.txt
          cargo test -p launchwright-native 2>&1 | tee evidence/native/cargo-test.log
          cargo build -p launchwright-native --release 2>&1 | tee evidence/native/cargo-build.log
          node tests/bundle-smoke.mjs
      - name: Retain exact bytes and lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-native-${{ github.sha }}
          path: |
            evidence/native/
            dist/native-bundle.json
            dist/launchwright-*.cjs
            target/release/launchwright-native
            Cargo.lock
          if-no-files-found: error
          retention-days: 14

  deltadesk:
    if: inputs.lane == 'all' || inputs.lane == 'deltadesk'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SEMWRIGHT_SHA: 4d291de26724810017ce7b6d185326514cb79fa6
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Pin Semwright Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          (cd .ci-semwright && rustup override set 1.98.1)
      - name: Bind runner Chromium exactly like Semwright CI
        run: |
          set -euo pipefail
          mkdir -p evidence/deltadesk
          command -v google-chrome
          google-chrome --version | tee evidence/deltadesk/browser-version.log
          test -x /opt/google/chrome/chrome
          sudo chmod 0755 /opt/google/chrome/chrome
          stat -c '%A %a %U:%G %n' /opt/google/chrome/chrome | tee evidence/deltadesk/browser-binary.log
          CHROMIUM=/opt/google/chrome/chrome
          echo "SEMWRIGHT_TEST_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          sha256sum "$CHROMIUM" | tee evidence/deltadesk/chromium.sha256
      - name: Start owned DeltaDesk A/B fixture
        run: |
          set -euo pipefail
          PORT=4399 node lab/deltadesk/server.mjs 4399 > evidence/deltadesk/server.log 2>&1 &
          echo "DELTADESK_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4399/health > evidence/deltadesk/health.json; then
              break
            fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:4399/health
          curl -fsS -X POST http://127.0.0.1:4399/lab/reset > evidence/deltadesk/reset.json
      - name: Execute DeltaDesk through real Semwright Chromium adapter
        env:
          LAUNCHWRIGHT_DELTADESK_ORIGIN: http://127.0.0.1:4399
          LAUNCHWRIGHT_EVIDENCE_DIR: ${{ github.workspace }}/evidence/deltadesk
        run: |
          set -euo pipefail
          cp acceptance/chromium_deltadesk.rs .ci-semwright/crates/adapters/tests/launchwright_deltadesk.rs
          (
            cd .ci-semwright
            cargo test --locked -p semwright-adapters --test launchwright_deltadesk -- --ignored --nocapture
          ) 2>&1 | tee evidence/deltadesk/semwright-browser.log
          grep -q '^REAL_DELTADESK_BROWSER_ACCEPTANCE_PASS ' evidence/deltadesk/semwright-browser.log
      - name: Ingest real adapter evidence without fabricating Platform authority
        env:
          SEMWRIGHT_CHECKOUT: ${{ github.workspace }}/.ci-semwright
          DELTADESK_DRIVER_RECEIPT: ${{ github.workspace }}/evidence/deltadesk/semwright-deltadesk-driver.json
        run: node scripts/verify-deltadesk-browser.mjs | tee evidence/deltadesk/launchwright-verifier.log
      - name: Stop owned DeltaDesk fixture
        if: always()
        run: |
          if [ -n "${DELTADESK_PID:-}" ]; then kill "$DELTADESK_PID" 2>/dev/null || true; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-deltadesk-${{ github.sha }}
          path: evidence/deltadesk/
          if-no-files-found: error
          retention-days: 14

  composition:
    if: inputs.lane == 'all' || inputs.lane == 'composition'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      SEMWRIGHT_SHA: 4d291de26724810017ce7b6d185326514cb79fa6
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      PLAYWRIGHT_BROWSERS_PATH: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Checkout exact reviewed Semwright source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: seradotcom/semwright
          ref: ${{ env.SEMWRIGHT_SHA }}
          path: .ci-semwright
          persist-credentials: false
      - name: Pin Semwright Rust compiler
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          (cd .ci-semwright && rustup override set 1.98.1)
      - name: Bind runner Chromium
        run: |
          set -euo pipefail
          mkdir -p evidence/composition
          command -v google-chrome
          google-chrome --version | tee evidence/composition/browser-version.log
          test -x /opt/google/chrome/chrome
          sudo chmod 0755 /opt/google/chrome/chrome
          CHROMIUM=/opt/google/chrome/chrome
          echo "SEMWRIGHT_TEST_CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          sha256sum "$CHROMIUM" | tee evidence/composition/chromium.sha256
      - name: Start owned DeltaDesk capture fixture
        run: |
          set -euo pipefail
          PORT=4399 node lab/deltadesk/server.mjs 4399 > evidence/composition/deltadesk-server.log 2>&1 &
          echo "DELTADESK_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4399/health > evidence/composition/deltadesk-health.json; then
              exit 0
            fi
            sleep 0.2
          done
          exit 1
      - name: Capture DeltaDesk A/B through exact Semwright Chromium adapter
        env:
          LAUNCHWRIGHT_DELTADESK_ORIGIN: http://127.0.0.1:4399
          LAUNCHWRIGHT_EVIDENCE_DIR: ${{ github.workspace }}/evidence/composition
        run: |
          set -euo pipefail
          cp acceptance/chromium_deltadesk.rs .ci-semwright/crates/adapters/tests/launchwright_deltadesk.rs
          (
            cd .ci-semwright
            cargo test --locked -p semwright-adapters --test launchwright_deltadesk -- --ignored --nocapture
          ) 2>&1 | tee evidence/composition/semwright-browser.log
          grep -q '^REAL_DELTADESK_BROWSER_ACCEPTANCE_PASS ' evidence/composition/semwright-browser.log
      - name: Stop DeltaDesk capture fixture
        if: always()
        run: |
          if [ -n "${DELTADESK_PID:-}" ]; then kill "$DELTADESK_PID" 2>/dev/null || true; fi
      - name: Install pinned Composition native runtimes
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            faust=2.70.3+ds-1.1build2 \
            libsndfile1-dev \
            libebur128-dev=1.2.6-1build1 \
            bubblewrap apparmor-profiles apparmor-utils \
            melt ffmpeg libpipewire-0.3-dev
          {
            dpkg-query -W faust libsndfile1-dev libebur128-dev
            melt -version | head -5
            ffmpeg -version | head -3
            ffprobe -version | head -3
            bwrap --version
          } > evidence/composition/native-runtime-versions.txt
      - name: Install scoped Driver Host AppArmor profile
        run: |
          bash .ci-semwright/scripts/dev/ci-driver-bwrap-profile.sh evidence/composition/sandbox-setup.log
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.22.0'
      - name: Install exact Motion Canvas runtime
        working-directory: .ci-semwright/integrations/motion-canvas/runtime
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps firefox
          npm run probe
          mkdir -p .semwright-tools
          cp "$(command -v node)" .semwright-tools/node
          chmod 0755 .semwright-tools/node
          mapfile -t BROWSERS < <(find node_modules/playwright-core/.local-browsers -path '*/firefox-*/firefox/firefox' -type f -perm -111 -print)
          test "${#BROWSERS[@]}" -eq 1
          BROWSER_REL=$(realpath --relative-to="$PWD" "${BROWSERS[0]}")
          python3 "$GITHUB_WORKSPACE/.ci-semwright/scripts/motion-canvas/runtime-manifest.py" --root "$PWD" --browser-rel "$BROWSER_REL"
      - name: Materialize pinned Faust library tree
        run: |
          set -euo pipefail
          export FAUST_STAGE="$RUNNER_TEMP/faust-libraries"
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          src=Path('/usr/share/faust'); dst=Path(os.environ['FAUST_STAGE'])
          if dst.exists(): shutil.rmtree(dst)
          dst.mkdir(parents=True,mode=0o700)
          pins={}
          for source in sorted(src.rglob('*.lib')):
              if not source.is_file(): continue
              relative=source.relative_to(src); target=dst/relative
              target.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(source,target,follow_symlinks=True); target.chmod(0o400)
              pins[relative.as_posix()]=hashlib.sha256(target.read_bytes()).hexdigest()
          if 'stdfaust.lib' not in pins or len(pins)<2: raise SystemExit('Faust library inventory is incomplete')
          (dst/'semwright-runtime.json').write_text(json.dumps({'schema_version':1,'compiler_version':'2.70.3','libraries':pins},separators=(',',':'),sort_keys=True))
          (dst/'semwright-runtime.json').chmod(0o400)
          for directory in sorted((p for p in dst.rglob('*') if p.is_dir()),reverse=True): directory.chmod(0o500)
          dst.chmod(0o500)
          if any(path.is_symlink() for path in dst.rglob('*')): raise SystemExit('staged Faust tree contains symlinks')
          PY
          echo "SEMWRIGHT_TEST_FAUST_LIBRARIES=$FAUST_STAGE" >> "$GITHUB_ENV"
      - name: Build exact Semwright host helpers and drivers
        working-directory: .ci-semwright
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Werror integrations/audio/faust-runtime/main.cpp -lfaust -lsndfile -o "$RUNNER_TEMP/semwright-faust-interpreter"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror integrations/audio/analysis-runtime/main.cpp -lebur128 -lsndfile -o "$RUNNER_TEMP/semwright-audio-meter"
          cargo build --locked --bins \
            -p semwright-plugin-host \
            -p semwright-driver-motion-canvas \
            -p semwright-faust-audio-driver \
            -p semwright-mlt-video-driver
          strip --strip-unneeded \
            target/debug/semwright-sandbox \
            target/debug/semwright-motion-canvas-driver \
            target/debug/semwright-faust-audio-driver \
            target/debug/semwright-audio-analysis-driver \
            target/debug/semwright-mlt-video-driver \
            target/debug/semwright-mlt-runtime-runner
          chmod 0500 \
            target/debug/semwright-sandbox \
            target/debug/semwright-motion-canvas-driver \
            target/debug/semwright-faust-audio-driver \
            target/debug/semwright-audio-analysis-driver \
            target/debug/semwright-mlt-video-driver \
            target/debug/semwright-mlt-runtime-runner
          mkdir -p "$RUNNER_TEMP/composition-av-binaries"
          for name in semwright-sandbox semwright-motion-canvas-driver semwright-faust-audio-driver semwright-audio-analysis-driver semwright-mlt-video-driver semwright-mlt-runtime-runner; do
            install -m 0500 "target/debug/$name" "$RUNNER_TEMP/composition-av-binaries/$name"
          done
          sha256sum "$RUNNER_TEMP/composition-av-binaries/"* > "$GITHUB_WORKSPACE/evidence/composition/prepared-binaries.sha256"
      - name: Produce 20-second MP4 from real DeltaDesk capture bytes through MLT Driver Host
        env:
          SEMWRIGHT_TEST_LAUNCHWRIGHT_REAL_MEDIA: '1'
          LAUNCHWRIGHT_CAPTURE_A: ${{ github.workspace }}/evidence/composition/deltadesk-a-checkout.png
          LAUNCHWRIGHT_CAPTURE_B: ${{ github.workspace }}/evidence/composition/deltadesk-b-checkout.png
          LAUNCHWRIGHT_COMPOSITION_EVIDENCE_DIR: ${{ github.workspace }}/evidence/composition
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ runner.temp }}/composition-av-binaries/semwright-sandbox
          SEMWRIGHT_TEST_MELT: /usr/bin/melt
          SEMWRIGHT_TEST_FFPROBE: /usr/bin/ffprobe
          SEMWRIGHT_TEST_FFMPEG: /usr/bin/ffmpeg
          SEMWRIGHT_TEST_BWRAP: /usr/bin/bwrap
        run: |
          set -euo pipefail
          cp acceptance/mlt_deltadesk_media.rs .ci-semwright/crates/driver-mlt-video/tests/launchwright_real_media.rs
          (
            cd .ci-semwright
            cargo test --locked -p semwright-mlt-video-driver --test launchwright_real_media \
              real_deltadesk_captures_become_verified_h264_mp4_inside_driver_host \
              -- --ignored --exact --nocapture
          ) 2>&1 | tee evidence/composition/semwright-real-media.log
          grep -q '^LAUNCHWRIGHT_REAL_MEDIA_DRIVER_PASS ' evidence/composition/semwright-real-media.log
      - name: Execute canonical Semwright Composition + Audio AV E2E at same SHA
        env:
          SEMWRIGHT_TEST_COMBINED_AV: '1'
          SEMWRIGHT_TEST_COMBINED_MOTION_DRIVER: ${{ runner.temp }}/composition-av-binaries/semwright-motion-canvas-driver
          SEMWRIGHT_TEST_COMBINED_FAUST_DRIVER: ${{ runner.temp }}/composition-av-binaries/semwright-faust-audio-driver
          SEMWRIGHT_TEST_COMBINED_ANALYSIS_DRIVER: ${{ runner.temp }}/composition-av-binaries/semwright-audio-analysis-driver
          SEMWRIGHT_TEST_COMBINED_MLT_RUNNER: ${{ runner.temp }}/composition-av-binaries/semwright-mlt-runtime-runner
          SEMWRIGHT_TEST_MOTION_NODE: ${{ github.workspace }}/.ci-semwright/integrations/motion-canvas/runtime/.semwright-tools/node
          SEMWRIGHT_TEST_COMBINED_MLT_DRIVER: ${{ runner.temp }}/composition-av-binaries/semwright-mlt-video-driver
          SEMWRIGHT_TEST_SANDBOX_HELPER: ${{ runner.temp }}/composition-av-binaries/semwright-sandbox
          SEMWRIGHT_TEST_MOTION_RUNTIME: ${{ github.workspace }}/.ci-semwright/integrations/motion-canvas/runtime
          SEMWRIGHT_TEST_FAUST_VERSION: '2.70.3'
          SEMWRIGHT_TEST_FAUST_HELPER: ${{ runner.temp }}/semwright-faust-interpreter
          SEMWRIGHT_TEST_AUDIO_METER: ${{ runner.temp }}/semwright-audio-meter
          SEMWRIGHT_TEST_MELT: /usr/bin/melt
          SEMWRIGHT_TEST_FFPROBE: /usr/bin/ffprobe
          SEMWRIGHT_TEST_FFMPEG: /usr/bin/ffmpeg
          SEMWRIGHT_TEST_BWRAP: /usr/bin/bwrap
        run: |
          set -euo pipefail
          (
            cd .ci-semwright
            GITHUB_SHA="$SEMWRIGHT_SHA" cargo test --locked -p semwright-av-composition --test combined_native \
              combined_a_b_native_av_candidate_uses_post_encode_audio_and_full_scan_sync \
              -- --ignored --exact --nocapture
          ) 2>&1 | tee evidence/composition/semwright-combined-av.log
          cp verification/composition-av/combined-native.json evidence/composition/semwright-combined-native.json
          cp verification/composition-av/c14-project-graph.json evidence/composition/semwright-combined-project-graph.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - name: Verify cross-system evidence without promoting partial proof to PASS
        env:
          DELTADESK_DRIVER_RECEIPT: ${{ github.workspace }}/evidence/composition/semwright-deltadesk-driver.json
          LAUNCHWRIGHT_REAL_MEDIA_RECEIPT: ${{ github.workspace }}/evidence/composition/launchwright-real-media-driver.json
          SEMWRIGHT_COMBINED_AV_RECEIPT: ${{ github.workspace }}/evidence/composition/semwright-combined-native.json
        run: |
          node scripts/verify-composition-real-media.mjs | tee evidence/composition/launchwright-composition-verifier.log
          node -e 'const r=require("./evidence/composition/launchwright-composition-chain.json"); if(r.technical_state!=="UNKNOWN"||r.media_requirement_state!=="PARTIAL"||r.native_driver_host_render!=="PASS"||r.canonical_composition_av_stack!=="PASS") process.exit(1)'
      - name: Capture sandbox diagnostics on failure
        if: failure()
        run: |
          {
            echo '=== aa-status ==='
            sudo aa-status || true
            echo '=== recent kernel/AppArmor/resource events ==='
            sudo journalctl -k --no-pager --since '-30 min' 2>/dev/null \
              | grep -Ei 'apparmor|audit|denied|bwrap|firefox|melt|ffmpeg|out of memory|oom|killed process|sigxcpu' \
              | tail -400 || true
          } > evidence/composition/sandbox-denials.log 2>&1
          cat evidence/composition/sandbox-denials.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-composition-real-media-${{ github.sha }}
          path: evidence/composition/
          if-no-files-found: error
          retention-days: 14

  stress:
    if: inputs.lane == 'all' || inputs.lane == 'stress'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bounded persistence, paging and restore stress
        run: node tests/stress.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: launchwright-stress-${{ github.sha }}
          path: evidence/stress/
          if-no-files-found: error
          retention-days: 14
