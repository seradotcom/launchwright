            .ci-semwright/crates/av-composition/tests/launchwright_deltadesk_single_recipe.rs
          rustup run 1.98.1 rustfmt --edition 2024 .ci-semwright/crates/av-composition/tests/launchwright_deltadesk_single_recipe.rs
          rustup run 1.98.1 rustfmt --edition 2024 --check .ci-semwright/crates/av-composition/tests/launchwright_deltadesk_single_recipe.rs
          sha256sum \
            .ci-semwright/crates/av-composition/tests/combined_native.rs \
            .ci-semwright/crates/av-composition/tests/launchwright_deltadesk_single_recipe.rs \
            scripts/prepare-composition-single-recipe.py \
            > evidence/composition/single-recipe-sources.sha256
      - name: Execute one canonical Composition recipe over the exact Broker capture bytes
        env:
          LAUNCHWRIGHT_SOURCE_SHA: ${{ github.sha }}
          LAUNCHWRIGHT_CAPTURE_A: ${{ github.workspace }}/evidence/composition/deltadesk-a-checkout.png
          LAUNCHWRIGHT_CAPTURE_B: ${{ github.workspace }}/evidence/composition/deltadesk-b-checkout.png
          SEMWRIGHT_TEST_COMBINED_AV: '1'
