name: Owned Android emulator capture acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-emulator.yml'
      - 'src/android-emulator-capture.mjs'
      - 'scripts/android-emulator-capture.mjs'
      - 'scripts/android-owned-apk-build.sh'
      - 'scripts/android-owned-ci.sh'
      - 'scripts/android-owned-smoke.mjs'
      - 'fixtures/android-owned/**'
      - 'tests/android-emulator-capture.test.mjs'
permissions:
  contents: read
concurrency:
  group: owned-android-emulator-${{ github.ref }}
  cancel-in-progress: false
jobs:
  android-owned:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Native SDK and bounded ADB negative tests
        run: |
          set -euo pipefail
          node scripts/verify.mjs
          node --test --test-concurrency=1 tests/android-emulator-capture.test.mjs
          node scripts/master-acceptance.mjs --check
      - name: Enable hardware acceleration on disposable Linux runner
        run: |
          sudo chmod 0666 /dev/kvm
      - name: Boot actual Android emulator and capture owned synthetic APK
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/android-owned-ci.sh
      - name: Preserve owned synthetic screenshot, strict Native receipt and plan
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-android-owned-${{ github.sha }}
          path: evidence/android-owned/
          if-no-files-found: warn
          retention-days: 14
