name: R69 owned GitHub Draft browser acceptance
on:
  pull_request:
    paths:
      - 'src/git-docs-draft-web.mjs'
      - 'src/server.mjs'
      - 'client/index.mjs'
      - 'web/**'
      - 'tests/git-docs-draft-*.mjs'
      - '.github/workflows/git-docs-draft-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-docs-draft-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-draft-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: node scripts/verify.mjs
      - run: node --test --test-concurrency=1 tests/git-docs-draft-pr.test.mjs tests/git-docs-draft-web.test.mjs tests/git-docs-draft-ui.test.mjs
      - name: Install headless Chromium on isolated CI runner
        run: |
          npm install --prefix .ci-tools --no-audit --no-fund --ignore-scripts playwright@1.58.2
          .ci-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Exact R40 branch through browser to R41 injected Draft and recover
        run: node tests/git-docs-draft-ui-browser.mjs
      - name: Retain SHA-specific synthetic provider/browser receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: launchwright-r69-owned-draft-browser-${{ github.sha }}
          path: evidence/git-docs-draft-browser/
          if-no-files-found: warn
          retention-days: 14
