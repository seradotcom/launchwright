[package]
name = "launchwright-native"
version = "0.2.0-dev.7"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-only"
description = "Launchwright canonical Semwright Native SDK NodeBridge driver"
publish = false

[dependencies]
semwright-native-sdk = { git = "https://github.com/seradotcom/semwright", rev = "d2da9a495a53fe279a1ca4de61f0e24646350f22", features = ["driver", "process-bridge", "graph", "effects"] }
tokio = { version = "1", features = ["rt", "macros"] }

[dev-dependencies]
semwright-project-graph = { git = "https://github.com/seradotcom/semwright", rev = "d2da9a495a53fe279a1ca4de61f0e24646350f22" }
